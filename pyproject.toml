[project]
name = "nirnay"
version = "0.1.0"
description = "Distilling Qwen2.5-0.5B into a Calibrated System One Decision Model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5.0",
    "torchvision",
    "transformers>=4.48.0",
    "datasets>=3.2.0",
    "peft>=0.14.0",
    "accelerate>=1.3.0",
    "scipy>=1.15.0",
    "scikit-learn>=1.6.0",
    "pydantic>=2.10.0",
    "tqdm>=4.67.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124" },
]
torchvision = [
  { index = "pytorch-cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
